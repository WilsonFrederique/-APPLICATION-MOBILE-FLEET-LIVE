name: fleetlive
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.18.1
  google_maps_flutter: ^2.12.3
  socket_io_client: ^2.0.0
  universal_html: ^2.2.1
  url_launcher: ^6.1.11
  firebase_core: ^3.15.1
  cloud_firestore: ^5.6.11
  firebase_database: ^11.3.9
  firebase_auth: ^5.6.2
  geolocator: ^14.0.2
  font_awesome_flutter: ^10.8.0
  liquid_swipe: ^3.0.0
  glassmorphism: ^2.0.0
  liquid_progress_indicator: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/logo2.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo2.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
